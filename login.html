<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyMate AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
    min-height: 100vh;
    width: 100%;
    display: grid;
    place-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
}

        .login-container {
            width: 100%;
            max-width: 430px;
            margin:0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px #5b21b51a;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #6d28d9;
            margin-bottom: 30px;
        }

        .logo span {
            color: #a78bfa;
        }

        h1 {
            font-size: 28px;
            color: #1e1b4b;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd6fe;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #6d28d9;
        }

        .switch-text {
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 14px;
        }

        .switch-text a {
            color: #7c3aed;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #7c3aed;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">✦ StudyMate <span>AI</span></div>

        <!-- LOGIN FORM -->
         <div id="loginForm">
    <form id="loginFormElement">

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail"
               placeholder="Enter your email" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password" required>
    </div>

    <button class="submit-btn" type="submit">
        Login to StudyMate →
    </button>

</form>
<p id="loginMessage" role="status"></p>

        <p class="switch-text">
            Don't have an account?
            <a onclick="showRegister()">Create one</a>
        </p>

        </div>   

<!-- REGISTER FORM -->
<div id="registerForm" class="hidden">

    <h1>Create Account</h1>
    <p class="subtitle">
        Start your personalized AI learning journey.
    </p>

    <form id="registerFormElement">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="registerName"
            placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="registerEmail"
            placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="registerPassword"
            minlength="6"
            placeholder="Create a password (6+ characters)" required>
        </div>

        <button class="submit-btn" type="submit">
            Create Account →
        </button>

    </form>

    <p id="registerMessage" class="switch-text" role="status"></p>

    <p class="switch-text">
        Already have an account?
        <a href="#" onclick="showLogin()">Login</a>
    </p>

</div>

<a href="index.html" class="back-link">
    ← Back to Home
</a>

</div>

<script>
const API_URL = "http://127.0.0.1:5000";

function showRegister() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("registerForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
}

async function sendRequest(endpoint, data) {
    const response = await fetch(`${API_URL}${endpoint}`, {
        method: "POST",
        credentials: "include",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
        throw new Error(result.error || "Something went wrong");
    }

    return result;
}

// LOGIN
document.getElementById("loginFormElement").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("loginMessage");
    const button = this.querySelector("button");

    message.textContent = "Logging in...";
    button.disabled = true;

    try {
        await sendRequest("/api/login", {
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value
        });

        message.textContent = "Login successful!";
        message.style.color = "green";

        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";
    } finally {
        button.disabled = false;
    }
});

// REGISTER
document.getElementById("registerFormElement").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("registerMessage");
    const button = this.querySelector("button");

    message.textContent = "Creating account...";
    button.disabled = true;

    try {
        await sendRequest("/api/register", {
            name: document.getElementById("registerName").value,
            email: document.getElementById("registerEmail").value,
            password: document.getElementById("registerPassword").value
        });

        message.textContent = "Account created successfully!";
        message.style.color = "green";

        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";
    } finally {
        button.disabled = false;
    }
});

</script>

</body>
</html>
