<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz | StudyMate AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f4fc;
    color: #25243a;
    padding: 30px 15px;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

.back {
    display: inline-block;
    color: #7664d8;
    text-decoration: none;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.progress {
    background: #eeeafc;
    height: 8px;
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
}

#progressBar {
    background: #8069df;
    height: 100%;
    width: 0%;
    transition: 0.3s;
}

#question {
    font-size: 21px;
    margin-bottom: 22px;
}

.option {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}

.option:hover {
    background: #f1edff;
    border-color: #8069df;
}

.option.correct {
    background: #e2f8e9;
    border-color: #35a65a;
}

.option.wrong {
    background: #ffe6e6;
    border-color: #e35b5b;
}

#feedback {
    margin: 18px 0;
    font-weight: bold;
}

.next, .restart {
    background: #8069df;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 9px;
    cursor: pointer;
    margin-top: 15px;
}

.next:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#result {
    display: none;
    text-align: center;
    padding: 20px;
}

#result h2 {
    margin-bottom: 15px;
}

</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Back to Dashboard</a>

<h1>🧠 AI Quiz</h1>
<p class="subtitle">Test your knowledge and improve your learning!</p>

<div id="quizSetup" style="margin:25px 0;">
    <h3>📚 Choose Your Quiz Topic</h3>

    <input
        type="text"
        id="quizTopic"
        placeholder="Enter topic (e.g. Python, HTML, AI)"
        style="width:100%; padding:14px; margin:15px 0; border:1px solid #ddd; border-radius:10px;"
    >

    <button onclick="generateQuiz()" class="next">
        ✨ Generate AI Quiz
    </button>

    <p id="quizStatus"></p>
</div>

<div id="quiz" style="display:none;">

<div class="progress">
    <div id="progressBar"></div>
</div>

<p id="counter"></p>
<h2 id="question"></h2>

<div id="options"></div>

<p id="feedback"></p>

<button class="next" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question →
</button>

</div>

<div id="result">
    <h2>🎉 Quiz Completed!</h2>
    <h1 id="score"></h1>
    <p id="message"></p>
    <button class="restart" onclick="restartQuiz()">Try Again</button>
    <br>
    <a href="dashboard.html" class="back">Back to Dashboard</a>
</div>

</div>

<script>
const API_URL = "http://127.0.0.1:5000";

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

async function generateQuiz() {
    const topic = document.getElementById("quizTopic").value.trim();
    const status = document.getElementById("quizStatus");

    if (!topic) {
        alert("Please enter a quiz topic!");
        return;
    }

    status.textContent = "✨ Generating your AI quiz...";

    try {
        const response = await fetch(API_URL + "/api/ai/quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ topic })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Quiz generation failed");
        }

        if (!Array.isArray(result.questions) || result.questions.length === 0) {
            throw new Error("No questions received. Try another topic.");
        }

        questions = result.questions;
        currentQuestion = 0;
        score = 0;

        document.getElementById("quizSetup").style.display = "none";
        document.getElementById("result").style.display = "none";
        document.getElementById("quiz").style.display = "block";

        loadQuestion();

    } catch (error) {
        status.textContent = error.message;
    }
}

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("counter").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("question").textContent = q.question;

    document.getElementById("progressBar").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

    document.getElementById("feedback").textContent = "";
    document.getElementById("nextBtn").disabled = true;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option;
        button.onclick = () => selectAnswer(index, button);
        optionsDiv.appendChild(button);
    });
}

function selectAnswer(index, button) {
    if (answered) return;

    answered = true;
    const correct = questions[currentQuestion].answer;

    document.querySelectorAll(".option").forEach((btn, i) => {
        btn.disabled = true;
        if (i === correct) btn.classList.add("correct");
    });

    if (index === correct) {
        score++;
        document.getElementById("feedback").textContent = "Correct answer! 🎉";
    } else {
        button.classList.add("wrong");
        document.getElementById("feedback").textContent =
            "Not quite! The correct answer is highlighted.";
    }

    document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("progressBar").style.width = "100%";
    document.getElementById("score").textContent =
        `${score} / ${questions.length}`;

    document.getElementById("message").textContent =
        score >= 4 ? "Excellent work! 🌟" :
        score >= 2 ? "Good effort! Keep practicing." :
        "Keep learning. You can do better!";
}

function restartQuiz() {
    questions = [];
    currentQuestion = 0;
    score = 0;

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("quizSetup").style.display = "block";
    document.getElementById("quizTopic").value = "";
    document.getElementById("quizStatus").textContent = "";
}
</script>

</body>
</html>
